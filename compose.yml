version: '3.8'

services:
  # Seu banco de dados PostgreSQL
  db:
    image: postgres:15
    container_name: taskflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - taskflow-pgdata:/var/lib/postgresql/data

  # Sua nova API NestJS
  api:
    build: 
      context: ./taskflow-api
    container_name: taskflow-nestjs
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Passa a URL do banco para o NestJS conseguir se conectar
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      - db

volumes:
  taskflow-pgdata: