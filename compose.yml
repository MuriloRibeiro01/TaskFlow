services:
  # Seu banco de dados PostgreSQL
  db:
    image: postgres:15
    container_name: taskflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # só a própria máquina acessa o banco; a API chega nele pela rede interna (db:5432)
      - "127.0.0.1:5435:5432"
    volumes:
      - taskflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API Spring Boot (a versão NestJS continua em ./taskflow-api, fora do compose)
  api:
    build:
      context: ./taskflow-api-spring
    container_name: taskflow-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Login sem Google para testes; desligado se não estiver no .env
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-false}
    depends_on:
      # O Flyway roda na inicialização: a API só sobe com o banco aceitando conexões.
      db:
        condition: service_healthy

volumes:
  taskflow-pgdata: